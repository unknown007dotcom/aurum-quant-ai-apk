name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  node-tests:
    name: Node test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: npm test --silent
